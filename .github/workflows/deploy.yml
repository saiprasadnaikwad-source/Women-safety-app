name: Deploy Mobile App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: npm install

      - name: Build app
        working-directory: ./mobile
        env:
          # Backend API base URL baked into the frontend bundle at build time.
          # Set the VITE_API_BASE_URL repository variable (Settings → Secrets and
          # variables → Actions → Variables) to the live backend URL, e.g.
          # https://<your-backend>.onrender.com
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SOCKET_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "VITE_API_BASE_URL variable not set in repository, defaulting to Render live backend."
            export VITE_API_BASE_URL="https://women-safety-app-7qc1.onrender.com"
            export VITE_SOCKET_URL="https://women-safety-app-7qc1.onrender.com"
          fi
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './mobile/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
